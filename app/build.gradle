plugins {
    id 'com.android.application'
}
android {
    namespace 'com.liuxi.cince'
    compileSdk 34
    defaultConfig {
        applicationId 'com.liuxi.cince'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
