name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Gradle project
        id: loc
        run: |
          f=$(find . -name settings.gradle -not -path '*/.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle bulunamadi. Depodaki dosyalar:"
            find . -not -path '*/.git/*' | head -60
            exit 1
          fi
          d=$(dirname "$f")
          echo "Gradle project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: liuxi-cince-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
