name: Bootstrap Chinese HSK v2

on:
  push:
    branches: [ v2-bootstrap ]
    paths:
      - chinese_hsk_v2_bootstrap.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chinese-hsk-v2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v2 expanded]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout v2-bootstrap
        uses: actions/checkout@v7
        with:
          ref: v2-bootstrap
          fetch-depth: 0

      - name: Verify transfer package
        run: |
          test -f chinese_hsk_v2_bootstrap.zip
          unzip -t chinese_hsk_v2_bootstrap.zip >/dev/null
          echo "Bootstrap ZIP verified."

      - name: Replace legacy working tree with v2 source
        shell: bash
        run: |
          mkdir -p /tmp/chinese-hsk-v2-clean
          unzip -q chinese_hsk_v2_bootstrap.zip -d /tmp/chinese-hsk-v2-clean
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/chinese-hsk-v2-clean/. .
          test -f VERSION
          test "$(cat VERSION | tr -d '\r\n')" = "2.0.0"

      - name: Preserve clean v2 source
        run: |
          mkdir -p /tmp/chinese-hsk-v2-source
          cp -a . /tmp/chinese-hsk-v2-source/
          rm -rf /tmp/chinese-hsk-v2-source/.git

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Generate and validate course content
        run: |
          python3 scripts/compile_authoring.py
          python3 scripts/build_media_catalog.py
          python3 scripts/build_visual_bible.py
          python3 scripts/build_visual_asset_queue.py
          python3 scripts/validate_visual_assets.py
          python3 scripts/validate_visual_runtime_mapping.py
          python3 scripts/build_audio_asset_queue.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/build_media_readiness_report.py
          python3 scripts/validate_content.py --strict
          python3 scripts/audit_content_quality.py
          python3 scripts/validate_app_flow.py

      - name: Build personal APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/debug/app-debug.apk dist personal

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-v2.0.0-personal-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit clean v2 source to bootstrap branch
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/chinese-hsk-v2-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace legacy app with Chinese HSK v2.0.0 [v2 expanded]"
          git push origin HEAD:v2-bootstrap

      - name: Summary
        if: always()
        run: |
          echo "## Chinese HSK v2 bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source version: 2.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target branch: v2-bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK artifact: ChineseHSK-v2.0.0-personal-apk" >> "$GITHUB_STEP_SUMMARY"
