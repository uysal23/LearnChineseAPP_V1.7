name: Bootstrap Chinese HSK v2

on:
  push:
    branches: [ v2-bootstrap ]
    paths:
      - chinese_hsk_v2_source.tar.xz
      - .github/workflows/bootstrap-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chinese-hsk-v2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v2 expanded]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout v2-bootstrap
        uses: actions/checkout@v7
        with:
          ref: v2-bootstrap
          fetch-depth: 0

      - name: Verify v2 source package
        shell: bash
        run: |
          test -f chinese_hsk_v2_source.tar.xz
          xz -t chinese_hsk_v2_source.tar.xz
          tar -tJf chinese_hsk_v2_source.tar.xz >/tmp/v2_tar_list.txt
          grep -qx './VERSION' /tmp/v2_tar_list.txt || grep -qx 'VERSION' /tmp/v2_tar_list.txt
          grep -Eq '(^|/)(app/build.gradle.kts)$' /tmp/v2_tar_list.txt
          grep -Eq '(^|/)(scripts/compile_authoring.py)$' /tmp/v2_tar_list.txt
          echo "Source package structure verified."

      - name: Expand clean v2 source
        shell: bash
        run: |
          rm -rf /tmp/chinese-hsk-v2-clean
          mkdir -p /tmp/chinese-hsk-v2-clean
          tar -xJf chinese_hsk_v2_source.tar.xz -C /tmp/chinese-hsk-v2-clean
          test -f /tmp/chinese-hsk-v2-clean/VERSION
          test "$(tr -d '\r\n' < /tmp/chinese-hsk-v2-clean/VERSION)" = "2.0.0"
          test -f /tmp/chinese-hsk-v2-clean/app/build.gradle.kts
          test -f /tmp/chinese-hsk-v2-clean/scripts/compile_authoring.py
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/chinese-hsk-v2-clean/. .
          echo "Expanded Chinese HSK v2.0.0 source."

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Compile authoring content
        run: python3 scripts/compile_authoring.py

      - name: Build media catalogs
        run: python3 scripts/build_media_catalog.py

      - name: Install Python image tooling
        run: python3 -m pip install --disable-pip-version-check "Pillow>=12,<13"

      - name: Build visual catalog
        run: |
          python3 scripts/build_visual_bible.py
          python3 scripts/build_visual_asset_queue.py
          python3 scripts/prepare_visual_assets.py
          python3 scripts/validate_visual_assets.py
          python3 scripts/validate_visual_runtime_mapping.py
          python3 scripts/validate_visual_binaries.py

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build audio catalog
        run: |
          python3 scripts/build_audio_asset_queue.py
          python3 scripts/prepare_audio_assets.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/build_media_readiness_report.py

      - name: Strict course validation
        run: |
          python3 scripts/validate_content.py --strict
          python3 scripts/audit_content_quality.py
          python3 scripts/validate_app_flow.py

      - name: Build personal APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: python3 scripts/package_apk_artifact.py app/build/outputs/apk/debug/app-debug.apk dist personal

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChineseHSK-v2.0.0-personal-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit clean v2 source to bootstrap branch
        shell: bash
        run: |
          rm -rf /tmp/chinese-hsk-v2-built
          mkdir -p /tmp/chinese-hsk-v2-built
          cp -a /tmp/chinese-hsk-v2-clean/. /tmp/chinese-hsk-v2-built/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/chinese-hsk-v2-built/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace legacy app with Chinese HSK v2.0.0 [v2 expanded]"
          git push origin HEAD:v2-bootstrap

      - name: Summary
        if: always()
        run: |
          echo "## Chinese HSK v2 bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source package integrity and structure verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Course target: 300 scenes / 30,000 dialogues" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK artifact: ChineseHSK-v2.0.0-personal-apk" >> "$GITHUB_STEP_SUMMARY"
